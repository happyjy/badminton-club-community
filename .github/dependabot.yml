version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # 패치·마이너는 PR 하나로 묶어 CI 통과 여부만 보고 머지한다.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 메이저 업그레이드는 직접 판단해서 올린다.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
